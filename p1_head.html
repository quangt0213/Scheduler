<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panda #2355 — Schedule & Labor Forecast</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f242e; --border:#2a3140;
  --text:#e8eaf0; --muted:#8b93a5; --accent:#d62b2b; --accent2:#ff6b4a;
  --green:#3ecf8e; --yellow:#f5c451; --red:#ff5a5a; --blue:#5aa7ff;
  --radius:10px; --mono:'SF Mono',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:17px;font-weight:700}
header h1 span{color:var(--accent2)}
.week-label{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button.active{color:#fff;background:var(--accent);border-color:var(--accent)}
main{padding:20px 24px;max-width:1350px;margin:0 auto}
.tab{display:none}
.tab.active{display:block}
h2{font-size:16px;margin-bottom:12px}
h3{font-size:14px;margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card .big{font-size:22px;font-weight:700;margin:4px 0}
.card .sub{color:var(--muted);font-size:12px}
.card h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--panel)}
.scroll-x{overflow-x:auto}
.heat td{text-align:center;font-family:var(--mono);font-size:12px;cursor:default}
.cell-g{background:rgba(62,207,142,.16);color:var(--green)}
.cell-y{background:rgba(245,196,81,.14);color:var(--yellow)}
.cell-r{background:rgba(255,90,90,.16);color:var(--red)}
.cell-off{color:#3a4152}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.b-ok{background:rgba(62,207,142,.15);color:var(--green)}
.b-warn{background:rgba(245,196,81,.15);color:var(--yellow)}
.b-crit{background:rgba(255,90,90,.15);color:var(--red)}
.b-info{background:rgba(90,167,255,.15);color:var(--blue)}
.b-muted{background:var(--panel2);color:var(--muted)}
button.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
button.btn:hover{filter:brightness(1.12)}
button.btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
button.btn.small{padding:5px 10px;font-size:12px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--accent2)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.shift-cell{cursor:pointer;border-radius:6px;padding:5px 7px}
.shift-cell:hover{background:var(--panel2)}
.shift-cell .brk{font-size:11px;color:var(--green)}
.shift-cell .brk.warn{color:var(--yellow)}
.shift-cell .brk.crit{color:var(--red)}
.timeline{position:relative;height:44px;background:var(--panel2);border-radius:8px;margin:10px 0;overflow:hidden}
.tl-seg{position:absolute;top:0;height:100%}
.tl-shift{background:rgba(90,167,255,.25);border:1px solid var(--blue)}
.tl-blackout{background:rgba(255,90,90,.25)}
.tl-break{background:var(--green);opacity:.9}
.tl-label{position:absolute;bottom:2px;font-size:9px;color:var(--muted)}
.win-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:var(--mono)}
.win-btn:hover{border-color:var(--green)}
.win-btn.selected{background:rgba(62,207,142,.2);border-color:var(--green);color:var(--green)}
.win-btn.suggested::after{content:" ★";color:var(--yellow)}
.alert-item{display:flex;gap:10px;padding:10px;border-radius:8px;margin-bottom:8px;background:var(--panel2);border-left:3px solid var(--muted)}
.alert-item.crit{border-left-color:var(--red)}
.alert-item.warn{border-left-color:var(--yellow)}
.alert-item.info{border-left-color:var(--blue)}
.alert-item.ok{border-left-color:var(--green)}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent2);color:var(--text)}
.chart-box{position:relative;height:260px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(560px,92vw);max-height:88vh;overflow-y:auto}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tag{font-size:11px;color:var(--muted)}
.risk-CRITICAL{color:var(--red);font-weight:700}
.risk-UNDER{color:var(--yellow);font-weight:600}
.risk-OK{color:var(--green)}
.risk-OVER{color:var(--blue)}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--green);padding:12px 18px;border-radius:10px;z-index:200;display:none;max-width:360px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media print{
  body{background:#fff;color:#000}
  header nav,header .actions,.no-print{display:none!important}
  .panel,.card{border-color:#ccc;background:#fff}
  .tab{display:none}.tab.print-me{display:block}
  th{background:#fff;color:#333}
}
</style>
</head>
